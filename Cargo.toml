# core/Cargo.toml
[package]
name = "matrix_core"
version = "0.1.0"
edition = "2024"

# 💡 DAS HIER JETZT EINTRAGEN:
[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Local ONNX embedder on the Apple Neural Engine (CoreML EP). Off by default so
# the core builds/tests with zero heavy/native deps.
#   * `onnx`          — link against an externally provided ONNX Runtime
#                       (iOS device build: set ORT_LIB_LOCATION to the static lib).
#   * `onnx-download` — host/dev convenience: fetch a prebuilt ONNX Runtime
#                       (pyke CDN, ONNX Runtime 1.28; rustls for the build-time fetch).
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray", "dep:image"]
onnx-download = ["onnx", "ort/download-binaries", "ort/tls-rustls"]
# Render PDF pages to images (pdf_oxide + tiny-skia, pure Rust): graphics-page
# selection + JPEG page images (`embedding/page_render.rs`), used by the app's
# ingest and `examples/{image_probe,page_stats}.rs`.
pdf-render = ["pdf_oxide/rendering"]
# `gguf` also builds llama.cpp's multimodal library (mtmd: image input for
# local vision models, `inference/gguf_vlm.rs`) — it builds on every target
# that builds llama.cpp (macOS, iOS device, iOS simulator), so no extra feature.
gguf = ["dep:llama-cpp-2", "llama-cpp-2/mtmd"]
gguf-metal = ["gguf", "llama-cpp-2/metal"]
gguf-cuda = ["gguf", "llama-cpp-2/cuda"]

[dependencies]
# hooks + limits: the read-only sheet-table query connection (db/sheet_query.rs)
# installs an authorizer, a progress handler (time limit) and a value-length limit.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
# API-key encryption at rest (`secrets.rs`): pure-Rust AEAD (no C, iOS/manylinux-safe).
chacha20poly1305 = "0.10.1"
base64 = "0.22"
pdf_oxide = "0.3.60"
# Base `ort` (all targets): CPU EP only, no CoreML. On Linux x86_64 the CoreML
# EP is apple-only and won't build, so it is added back below *only* on apple
# targets. Cargo unifies the two entries: apple → coreml+ndarray (unchanged from
# before the AP7 split), non-apple → ndarray only (CPU EP). See DUAL_TARGET_PLAN.md
# AP7 (embedding-parity: local ONNX on Linux via CPU-EP).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray"] }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.17", optional = true }
# Image decode/resize for the vision embedder (`embedding/vision.rs`); already in
# the graph via pdf_oxide, so no extra build cost.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
llama-cpp-2 = { version = "0.1.146", optional = true, default-features = false }

# Apple-only: re-add the CoreML execution provider. iOS runs on the ANE via
# CoreML; macOS may honor a per-model CoreML/ANE setting (see embedding/onnx.rs).
# This target-specific entry is unified with the base `ort` above → apple gets
# coreml+ndarray, non-apple stays CPU-only. Keeps the apple build byte-identical
# to before the split while letting Linux type-check without the coreml feature.
[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "coreml", "ndarray"] }
